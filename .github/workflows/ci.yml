name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      # Coverage is reported once, from the newest Ruby and Rails. Fork PRs get no OIDC token, and an
      # outage at Qlty should never block a merge.
      - name: Upload coverage to Qlty
        if: matrix.ruby == '4.0' && matrix.rails == '8.1' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/coverage.json

  package:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build mcp_on_ruby.gemspec --strict

  # Single required status check for branch protection, independent of the matrix shape.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            [ "$result" = "success" ] || exit 1
          done
