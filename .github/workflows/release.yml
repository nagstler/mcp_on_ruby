name: Release

# release-please keeps a release PR open that bumps McpOnRuby::VERSION and CHANGELOG.md from the
# Conventional Commit titles merged since the last release. Merging that PR tags the release,
# publishes the GitHub release, and pushes the gem to RubyGems via trusted publishing.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to RubyGems
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version="$(ruby -Ilib -e 'require "mcp_on_ruby/version"; print McpOnRuby::VERSION')"
          test "v${version}" = "${{ needs.release-please.outputs.tag_name }}"
      - run: bundle exec rspec
      - uses: rubygems/configure-rubygems-credentials@v2
      - name: Build and push
        run: |
          gem build mcp_on_ruby.gemspec --strict
          gem push mcp_on_ruby-*.gem
