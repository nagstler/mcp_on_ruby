      #how-it-works-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <pattern id="how-it-works-how-it-works-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
