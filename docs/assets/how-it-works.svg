    <title id="how-it-works-title">How MCP on Ruby handles a tool call</title>
    <desc id="how-it-works-desc">An MCP client's tool call passes through the official mcp gem to MCP on Ruby, which runs it as an ordinary request through your Rails app's middleware, filters, and controller as the caller, and returns the JSON response as the tool result.</desc>
