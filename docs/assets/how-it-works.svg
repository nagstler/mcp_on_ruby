    <title id="how-it-works-title">How MCP on Ruby handles a tool call</title>
    <desc id="how-it-works-desc">An MCP client calls a tool through the official mcp gem; MCP on Ruby's dispatcher finds the declared controller action and runs it as an in-process request through the Rails stack, as the caller, and turns the controller's response into the tool result.</desc>
